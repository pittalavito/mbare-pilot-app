[project]
name = "mbare-pilot-app"
version = "0.1.0"
description = "Agentic app: datapizza-ai + FastAPI, a React frontend (web/), Postgres, Redis and a local file store"
requires-python = ">=3.12"
dependencies = [
    "datapizza-ai>=0.1.0",
    "datapizza-ai-clients-openai>=0.0.12",
    "pydantic>=2.13",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "sqlmodel>=0.0.24",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "httpx>=0.28",
    "pgvector>=0.3",
    "cryptography>=44",
    "datapizza-ai-clients-openai-like>=0.0.11",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "psutil>=6.0",
    "pyyaml>=6.0",
]

[tool.uv]
managed = true
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "fakeredis>=2.26",
    "ruff>=0.17.3",
    "mypy>=2.4.1",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src", "test"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
omit = [
    "*/main.py",
    "*/worker.py",
    "*/api.py",
]

[tool.coverage.report]
# The tests fail when the coverage of src/ goes under this (CI and run-test.py).
# It was 97% when set: raise it as the coverage grows, never lower it to get green.
fail_under = 95
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 160
src = ["src", "test", "resource/scripts"]
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
# datetime.UTC and PEP 695 generics: the code keeps timezone.utc and Generic[T].
ignore = ["UP017", "UP046"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be called in the signature.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src"]
explicit_package_bases = true
ignore_missing_imports = true

# Type errors not fixed yet: remove a module from the list once it is clean.
[[tool.mypy.overrides]]
module = [
    "config",
    "domain.agent.masking",
    "domain.agent.tracing",
    "domain.chat.mock_client",
    "domain.client.copilot.cli",
    "domain.client.copilot.process",
    "domain.client.git.client",
    "domain.pipeline.graph",
    "domain.project.note_templates",
    "models.domain.agent",
    "models.domain.definitions",
    "models.store.db",
    "service.atlassian_service",
    "service.automation_cache_service",
    "service.chatbot_service",
    "service.copilot_service",
    "service.definition_service",
    "service.pipeline_runner",
    "service.pipeline_service",
    "service.project_data_service",
]
ignore_errors = true

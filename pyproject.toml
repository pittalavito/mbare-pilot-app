[project]
name = "mbare-pilot-app"
version = "0.1.0"
description = "Agentic app skeleton: datapizza-ai + Streamlit, Postgres, Redis and a local file store"
requires-python = ">=3.12"
dependencies = [
    "datapizza-ai>=0.1.0",
    "datapizza-ai-clients-openai>=0.0.12",
    "streamlit>=1.57",
    "pandas>=2.2",
    "pydantic>=2.13",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "sqlmodel>=0.0.24",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "httpx>=0.28",
    "pgvector>=0.3",
    "cryptography>=44",
    "datapizza-ai-clients-openai-like>=0.0.11",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "psutil>=6.0",
    "streamlit-flow-component>=1.6.1",
    "pyyaml>=6.0",
]

[tool.uv]
managed = true
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "fakeredis>=2.26",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src", "ui", "test"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
omit = [
    "*/main.py",
    "*/worker.py",
    "*/ui/views/*",
    "*/api.py",
]

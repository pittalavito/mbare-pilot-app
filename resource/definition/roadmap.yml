# La bacheca di Mbare Pilot (piano 30): le attività future dell'app, verso la demo.
# status: todo | in_progress | done · kind: uso | progettazione | refactoring | documentazione | rag | integrazione
# owner: tu | claude | copilot | agente remoto. Si sovrascrive mettendo un roadmap.yml nella cartella dati (definition/).

goal: Demo datapizza
vision: >-
  Qui chi usa l'app aprirà bug e attività su Mbare Pilot stesso, con gli stessi strumenti dei progetti,
  e li affiderà a un agente: Claude, Copilot o un agente remoto. Per ora è la mappa di quello che manca alla demo.

items:
  - title: Uso quotidiano
    description: Usare l'app ogni giorno sui progetti veri per trovare cosa manca e cosa non funziona.
    kind: uso
    owner: tu
    status: in_progress

  - title: Progettazione della dashboard di sviluppo
    description: Progettare questa pagina come dashboard vera, dove aprire bug e attività sull'app e affidarli a un agente.
    kind: progettazione
    owner: tu
    status: todo

  - title: Refactoring del codice
    description: Togliere il codice superfluo rimasto dai piani precedenti e semplificare dove serve.
    kind: refactoring
    owner: claude
    status: todo

  - title: Refactoring della documentazione md
    description: Riordinare la documentazione in markdown, togliere il superato e allinearla al codice di oggi.
    kind: documentazione
    owner: claude
    status: todo

  - title: Documentazione nel RAG
    description: Indicizzare nel RAG la documentazione md e darla come contesto agli agenti della dashboard.
    kind: rag
    owner: claude
    status: todo

  - title: Integrazione Bitbucket, Jenkins e Dynatrace
    description: Gli ultimi passi di un'attività - pull request su Bitbucket, build su Jenkins, controllo su Dynatrace.
    kind: integrazione
    owner: agente remoto
    status: todo
    feasibility: Fattibilità già verificata.

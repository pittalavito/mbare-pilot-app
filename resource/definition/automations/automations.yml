# Automation di ogni progetto (salvo che il progetto ne abbia una con lo stesso nome).
# Campi: docs/doc/definitions.md
# Si rifanno da capo poco alla volta (piano 24): per ora solo la prova.

automations:

###################
#### Prova git ####
###################
  - name: Prova git
    description: >-
      Prova: stato git di tutti i repository del progetto salvato in una nota, poi stop. Nessun input.
    steps:
      - name: Stato
        tool: git_status
        args: {repository: '*'}
      - name: Nota
        tool: save_note
        args: {content: '{input}', title: 'prova-git-{date}'}
    edges:
      - {from: input, to: Stato}
      - {from: Stato, to: Nota}

# GitHub Copilot: prompt, checklist e divieti degli agent task delegati. Letto a ogni uso.
# Un progetto ne sostituisce i campi con project/<progetto>/coding-agents/copilot/coding-agent.yml (prompt_file accanto al file). Campi: docs/doc/definitions.md

################################
#### Prompt di preparazione ####
################################
plan_prompt: |
  Ti affido il task {task}, sul repository in cui ti trovi. Il task completo lo leggi
  con il tool MCP read_task del server «mbare-pilot», i riferimenti collegati con list_references e read_reference.
  Per architettura, convenzioni e decisioni del progetto cerca con search_context (cita documento e sezione).
  Prima di cambiare qualcosa:
  1. leggi il task, i riferimenti e il codice che ti serve;
  2. fammi le domande necessarie per chiarire il task, poche e precise;
  3. quando non hai più domande, proponi un piano breve e aspetta il mio ok.
  Parliamo attraverso un'app, a turni: ogni mio messaggio ti arriva come un nuovo turno, quindi fai pure le tue domande e aspetta la risposta. Adesso sei in modalità piano e non puoi modificare niente: è giusto così. Il via lo do io con il pulsante «Ok, parti» dell'app, che ti riattiva per eseguire il piano; non chiedermi di uscire dalla modalità piano né di premere tasti. Anche dopo l'ok non farai commit, push né altre operazioni git che cambiano la storia, l'indice o i branch: il commit lo faccio io.

##############################
#### Prompt di esecuzione ####
##############################
execute_prompt: >-
  Ok, procedi con il piano concordato. Non fare commit, push né altre operazioni git che cambiano la storia,
  l'indice o i branch. Se ti serve una mia decisione chiedimela con il tool ask_user (aspetto e ti rispondo).
  Alla fine chiama il tool finish con un riassunto di cosa hai cambiato (file e motivo) e se i criteri di
  accettazione sono soddisfatti, e scrivi lo stesso riassunto nella risposta.

#################################
#### Prompt per tipo di task ####
#################################
type_prompts:
  development: ""
  analysis: analisi
  confluence: confluence
  jira: jira

############################
#### Checklist dei task ####
############################
task_checklists:
  development:
    - obiettivo chiaro, in una o due frasi
    - repository su cui lavorare
    - criteri di accettazione verificabili (es. i test che devono passare)
    - vincoli, cioè cosa non toccare
  analysis:
    - la domanda a cui rispondere
    - repository e parti di codice da guardare
    - la forma della risposta (es. elenco di rischi, opzioni con una raccomandazione)
  confluence:
    - spazio e pagina padre, o la pagina da aggiornare
    - per chi è la pagina
    - gli argomenti da coprire
    - i riferimenti da cui partire
  jira:
    - la chiave della issue, o il progetto per una nuova
    - la storia attuale o il bisogno da cui nasce
    - i criteri di accettazione attesi

######################
#### Tool vietati ####
######################
denied_tools:
  - shell(git commit)
  - shell(git push)
  - shell(git add)
  - shell(git rm)
  - shell(git mv)
  - shell(git restore)
  - shell(git reset)
  - shell(git checkout)
  - shell(git switch)
  - shell(git stash)
  - shell(git rebase)
  - shell(git merge)
  - shell(git cherry-pick)
  - shell(git revert)
  - shell(git am)
  - shell(git tag)
  - shell(git branch)
  - shell(git clean)
  - shell(git update-ref)
  - shell(git worktree)


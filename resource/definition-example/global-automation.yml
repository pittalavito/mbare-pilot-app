# Automation di ogni progetto (salvo che il progetto ne abbia una con lo stesso nome).
automations:
  - name: Stato del mattino
    description: Stato git di tutti i repository del progetto, riassunto in una nota (prima quelli che chiedono attenzione).
    steps:
      - name: Stato git
        function: git_status
        params: {repository: "*"}
      - name: Riassunto
        model: openrouter/google/gemini-3.1-flash-lite-preview
        system_prompt: |
          Ricevi lo stato git dei repository di un progetto. Scrivi un riassunto breve in italiano, in markdown:
          1. «Da guardare»: i repository con commit da pullare, commit da pushare, file modificati, un branch diverso
             da main/master o lo stato non letto. Per ognuno una riga: nome, cosa c'è e cosa conviene fare.
          2. «A posto»: gli altri, tutti in una riga.
          Se è tutto a posto, dillo in una frase. Usa solo quello che c'è nel testo: non inventare niente.
      - name: Nota
        function: save_note
        params: {title: "stato-del-mattino-{date}"}

  - name: Coverage prima del push
    description: >-
      Coverage JaCoCo delle righe nei commit non ancora pushati (solo src/main/java), soglia 80%. Lancia
      mvn jacoco:report (non i test) solo nei repository allineati al POM parent. Nota solo se qualcuno è sotto soglia.
    steps:
      - name: Coverage
        function: coverage_new_code
        params: {repository: "*", threshold: 80, parent_artifact_id: "", property: "*.libraries.version"}
      - name: Nota
        function: save_note
        params: {title: "coverage-nuovo-codice-{date}"}
    edges:
      - {from: input, to: Coverage}
      - {from: Coverage, to: Nota, if: contains, value: "sotto soglia"}

  - name: Prepara sviluppo
    description: >-
      La lancia l'app alla delega a Copilot, prima della chat (non serve lanciarla a mano): ferma tutto se ci sono
      modifiche non committate, porta ogni repository sul suo branch (lo crea dal base se manca) e lo aggiorna solo in
      fast-forward, poi controlla l'allineamento dei pom.xml (solo un avviso). Se uno step fallisce Copilot non parte.
      Input: una riga per repository, «<repository> <branch> [<base>]» (. = la cartella del progetto).
    steps:
      - name: Pulito
        function: git_check_clean
      - name: Branch
        function: git_checkout_branches
      - name: POM
        function: maven_parent_alignment
        params: {parent_artifact_id: "", property: "*.libraries.version"}
    edges:
      - {from: input, to: Pulito}
      - {from: Pulito, to: Branch}
      - {from: Branch, to: POM}

  - name: Verifica sviluppo
    description: >-
      La lancia l'app quando un task di sviluppo finito da Copilot va «da verificare» (non serve lanciarla a mano):
      toglie la cartella mbare-pilot del task e i commenti todoMbarePilot dai file cambiati, poi lancia i test (tutti o
      solo quelli toccati, come dice il task o il progetto). L'esito va nella chat di Copilot; se fallisce decidi tu se
      rimandare il task a Copilot. Input: «<repository> <task> [all|touched]».
    steps:
      - name: Pulizia
        function: clean_mbare_pilot
        params: {remove_todos: true}
      - name: Test
        function: run_tests
        params: {timeout_minutes: 20}
    edges:
      - {from: input, to: Pulizia}
      - {from: Pulizia, to: Test}

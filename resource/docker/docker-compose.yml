name: mbare-pilot-app

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: mbare-pilot-app-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      - POSTGRES_DB=${POSTGRES_DB:?}
    ports:
      - "${POSTGRES_HOST_PORT:?}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-dashboard:
    image: adminer:latest
    container_name: mbare-pilot-app-postgres-dashboard
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    ports:
      - "${POSTGRES_DASHBOARD_PORT:?}:8080"
    depends_on:
      - postgres
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: mbare-pilot-app-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_HOST_PORT:?}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-dashboard:
    image: rediscommander/redis-commander:latest
    container_name: mbare-pilot-app-redis-dashboard
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "${REDIS_DASHBOARD_PORT:?}:8081"
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
